<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>J.A.R.V.I.S</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>J.A.R.V.I.S</h1>
    <p>PERSONAL AI ASSISTANT</p>
  </header>

  <div class="core">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="center"></div>
  </div>

  <p class="core-text">SYSTEM READY</p>

  <div class="status">

    <h2>SYSTEM STATUS</h2>

    <div class="row">
      <span>AI CORE</span>
      <b class="on">● ONLINE</b>
    </div>

    <div class="row">
      <span>NETWORK</span>
      <b class="on">● ONLINE</b>
    </div>

    <div class="row">
      <span>VOICE</span>
      <b class="on">● UNLOCKED</b>
    </div>

    <div class="row">
      <span>MEMORY</span>
      <b class="on">● ACTIVE</b>
    </div>

  </div>

  <div id="chat" class="chat"></div>

  <div class="input-area">

    <input
      id="msg"
      type="text"
      autocomplete="off"
      placeholder="Talk to J.A.R.V.I.S..."
    >

    <button id="send" type="button">
      EXECUTE
    </button>

    <button id="mic-btn" type="button">
      🎙️
    </button>

    <button id="cam-btn" type="button">
      📷
    </button>

    <button id="clear-btn" type="button">
      CLEAR
    </button>

    <input
      id="img-input"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
    >

  </div>

  <!-- ONLY SCRIPT -->
  <script src="./script.js"></script>

</body>
</html>
